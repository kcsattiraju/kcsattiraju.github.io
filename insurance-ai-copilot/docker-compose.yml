
services:
  postgres:
    image: postgres:16
    container_name: insurance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: insurance_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: insurance_copilot

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - insurance_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_app -d insurance_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  insurance_postgres_data:
